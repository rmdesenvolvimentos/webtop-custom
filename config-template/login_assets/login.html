<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Windows - Entrar</title>
  <link rel="icon" type="image/png" href="/windows-start-32.png">
  <style>
    @font-face {
      font-family: 'Segoe UI';
      src: local('Segoe UI'), local('SegoeUI');
      font-weight: 400;
    }
    @font-face {
      font-family: 'Segoe UI';
      src: local('Segoe UI Semibold'), local('SegoeUISemibold');
      font-weight: 600;
    }
    @font-face {
      font-family: 'Segoe UI';
      src: local('Segoe UI Light'), local('SegoeUILight');
      font-weight: 300;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, 'Helvetica Neue', sans-serif;
      background-color: #000;
      color: #fff;
    }

    .bg-image {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: url('/login_assets/wallpaper.jpg') no-repeat center center;
      background-size: cover;
      transition: filter 0.4s ease, transform 0.4s ease;
      z-index: 1;
    }

    .bg-image.blurred {
      filter: blur(25px) brightness(0.75);
      transform: scale(1.04);
    }

    /* ==========================================================
       TELA DE BLOQUEIO (LOCK SCREEN)
       ========================================================== */
    .lock-screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 60px 80px 40px 80px;
      cursor: pointer;
      transition: transform 0.45s cubic-bezier(0.1, 0.9, 0.2, 1), opacity 0.35s ease;
    }

    .lock-screen.unlocked {
      transform: translateY(-100%);
      opacity: 0;
      pointer-events: none;
    }

    .lock-clock-container {
      display: flex;
      flex-direction: column;
    }

    .lock-time {
      font-size: 88px;
      font-weight: 300;
      letter-spacing: -2px;
      line-height: 1;
      text-shadow: 0 4px 18px rgba(0, 0, 0, 0.4);
    }

    .lock-date {
      font-size: 22px;
      font-weight: 400;
      margin-top: 14px;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.4);
      color: #f0f0f0;
    }

    .lock-bottom-bar {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 20px;
    }

    .lock-bottom-icon {
      width: 22px;
      height: 22px;
      fill: #ffffff;
      opacity: 0.85;
      filter: drop-shadow(0 2px 6px rgba(0,0,0,0.5));
    }

    /* ==========================================================
       TELA DE LOGIN (LOGIN SCREEN)
       ========================================================== */
    .login-screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 5;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transform: scale(0.96);
      transition: opacity 0.4s ease, transform 0.4s ease;
      pointer-events: none;
    }

    .login-screen.active {
      opacity: 1;
      transform: scale(1);
      pointer-events: auto;
    }

    .login-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 320px;
      margin-top: -30px;
    }

    .avatar-wrapper {
      position: relative;
      width: 128px;
      height: 128px;
      border-radius: 50%;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.25), rgba(255, 255, 255, 0.05));
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.3);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 24px;
    }

    .avatar-wrapper svg {
      width: 72px;
      height: 72px;
      fill: #ffffff;
      opacity: 0.95;
    }

    .user-name {
      font-size: 26px;
      font-weight: 600;
      margin-bottom: 22px;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
      letter-spacing: -0.3px;
    }

    .input-group {
      position: relative;
      width: 100%;
      display: flex;
      align-items: center;
    }

    .input-password {
      width: 100%;
      height: 38px;
      background: rgba(30, 30, 30, 0.85);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.22);
      border-radius: 4px;
      padding: 0 72px 0 14px;
      color: #ffffff;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s ease, background 0.2s ease, box-shadow 0.2s ease;
    }

    .input-password:focus {
      background: rgba(40, 40, 40, 0.95);
      border-color: #60cdff;
      border-bottom: 2px solid #60cdff;
      box-shadow: 0 0 12px rgba(96, 205, 255, 0.3);
    }

    .input-password::placeholder {
      color: #a0a0a0;
      font-size: 13px;
    }

    .btn-eye {
      position: absolute;
      right: 36px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 4px;
      opacity: 0.7;
      transition: opacity 0.15s, background 0.15s;
    }

    .btn-eye:hover {
      opacity: 1;
      background: rgba(255, 255, 255, 0.1);
    }

    .btn-eye svg {
      width: 16px;
      height: 16px;
      fill: #ffffff;
    }

    .btn-submit {
      position: absolute;
      right: 4px;
      top: 50%;
      transform: translateY(-50%);
      width: 30px;
      height: 30px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 3px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s, border-color 0.15s;
    }

    .btn-submit:hover {
      background: rgba(255, 255, 255, 0.22);
      border-color: rgba(255, 255, 255, 0.35);
    }

    .btn-submit svg {
      width: 14px;
      height: 14px;
      fill: #ffffff;
    }

    /* Estado de carregamento "Bem-vindo" */
    .loading-state {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin-top: 10px;
    }

    .loading-state.active {
      display: flex;
    }

    .welcome-text {
      font-size: 18px;
      font-weight: 400;
      margin-top: 16px;
      color: #e0e0e0;
      letter-spacing: 0.2px;
    }

    /* Progress Ring Windows 11 */
    .win-spinner {
      width: 36px;
      height: 36px;
      animation: spin 1.4s linear infinite;
    }

    .win-spinner circle {
      stroke: #60cdff;
      stroke-width: 3;
      stroke-linecap: round;
      stroke-dasharray: 60;
      stroke-dashoffset: 45;
      fill: none;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .error-msg {
      margin-top: 14px;
      font-size: 13px;
      color: #ff99a4;
      text-align: center;
      line-height: 1.4;
      opacity: 0;
      transition: opacity 0.2s ease;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.6);
    }

    .error-msg.visible {
      opacity: 1;
    }

    /* Animacao shake para erro */
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-8px); }
      40%, 80% { transform: translateX(8px); }
    }

    .shake {
      animation: shake 0.35s ease-in-out;
    }

    /* Icones no canto inferior direito da tela de login */
    .login-bottom-bar {
      position: absolute;
      bottom: 24px;
      right: 32px;
      display: flex;
      gap: 16px;
      align-items: center;
    }

    .bottom-btn {
      width: 40px;
      height: 40px;
      border-radius: 4px;
      background: transparent;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0.75;
      transition: opacity 0.15s, background 0.15s;
    }

    .bottom-btn:hover {
      opacity: 1;
      background: rgba(255, 255, 255, 0.12);
    }

    .bottom-btn svg {
      width: 20px;
      height: 20px;
      fill: #ffffff;
    }

    @media (max-width: 600px) {
      .lock-screen {
        padding: 40px 30px 24px 30px;
      }
      .lock-time {
        font-size: 64px;
      }
      .lock-date {
        font-size: 18px;
      }
      .login-card {
        width: 280px;
      }
    }
  </style>
</head>
<body>

  <!-- Plano de Fundo -->
  <div class="bg-image" id="bgImage"></div>

  <!-- TELA DE BLOQUEIO (Lock Screen) -->
  <div class="lock-screen" id="lockScreen">
    <div class="lock-clock-container">
      <div class="lock-time" id="lockTime">12:00</div>
      <div class="lock-date" id="lockDate">segunda-feira, 26 de outubro</div>
    </div>
    <div class="lock-bottom-bar">
      <!-- Wi-Fi -->
      <svg class="lock-bottom-icon" viewBox="0 0 24 24">
        <path d="M12 4C7.31 4 3.07 5.9 0 8.98L12 21 24 8.98C20.93 5.9 16.69 4 12 4zm0 3.19c3.8 0 7.23 1.54 9.72 4.03L12 19.18 2.28 11.22C4.77 8.73 8.2 7.19 12 7.19z"/>
      </svg>
      <!-- Bateria -->
      <svg class="lock-bottom-icon" viewBox="0 0 24 24">
        <path d="M15.67 4H14V2h-4v2H8.33C7.6 4 7 4.6 7 5.33v15.33C7 21.4 7.6 22 8.33 22h7.33c.74 0 1.34-.6 1.34-1.33V5.33C17 4.6 16.4 4 15.67 4z"/>
      </svg>
    </div>
  </div>

  <!-- TELA DE LOGIN (Login Screen) -->
  <div class="login-screen" id="loginScreen">
    <div class="login-card" id="loginCard">
      <!-- Avatar de Usuário Estilo Windows -->
      <div class="avatar-wrapper">
        <svg viewBox="0 0 24 24">
          <path d="M12 12c2.7 0 4.9-2.2 4.9-4.9S14.7 2.2 12 2.2 7.1 4.4 7.1 7.1 9.3 12 12 12zm0 2.4c-3.3 0-9.8 1.6-9.8 4.9V22h19.6v-2.7c0-3.3-6.5-4.9-9.8-4.9z"/>
        </svg>
      </div>

      <!-- Nome do Usuário -->
      <div class="user-name" id="userNameDisplay">Admin</div>

      <!-- Campo de Senha / PIN -->
      <div class="input-group" id="inputGroup">
        <input 
          type="password" 
          class="input-password" 
          id="passwordInput" 
          placeholder="Senha" 
          autocomplete="current-password"
          autofocus
        />
        <button type="button" class="btn-eye" id="btnEye" title="Mostrar senha" tabindex="-1">
          <svg id="eyeIcon" viewBox="0 0 24 24">
            <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>
          </svg>
        </button>
        <button type="button" class="btn-submit" id="btnSubmit" title="Entrar">
          <svg viewBox="0 0 24 24">
            <path d="M5 13h11.86l-5.43 5.43 1.42 1.42L21.14 12l-8.29-7.85-1.42 1.42L16.86 11H5v2z"/>
          </svg>
        </button>
      </div>

      <!-- Spinner "Bem-vindo" -->
      <div class="loading-state" id="loadingState">
        <svg class="win-spinner" viewBox="0 0 36 36">
          <circle cx="18" cy="18" r="14"></circle>
        </svg>
        <div class="welcome-text">Bem-vindo</div>
      </div>

      <!-- Mensagem de Erro -->
      <div class="error-msg" id="errorMsg">A senha está incorreta. Tente novamente.</div>
    </div>

    <!-- Barra Inferior (Acessibilidade, Rede, Desligar) -->
    <div class="login-bottom-bar">
      <!-- Rede -->
      <button class="bottom-btn" title="Rede conectada">
        <svg viewBox="0 0 24 24">
          <path d="M12 4C7.31 4 3.07 5.9 0 8.98L12 21 24 8.98C20.93 5.9 16.69 4 12 4zm0 3.19c3.8 0 7.23 1.54 9.72 4.03L12 19.18 2.28 11.22C4.77 8.73 8.2 7.19 12 7.19z"/>
        </svg>
      </button>
      <!-- Acessibilidade -->
      <button class="bottom-btn" title="Facilidade de Acesso">
        <svg viewBox="0 0 24 24">
          <path d="M12 2c1.1 0 2 .9 2 2s-.9 2-2 2-2-.9-2-2 .9-2 2-2zm9 7h-6v13h-2v-6h-2v6H9V9H3V7h18v2z"/>
        </svg>
      </button>
      <!-- Energia -->
      <button class="bottom-btn" title="Energia" onclick="location.reload()">
        <svg viewBox="0 0 24 24">
          <path d="M13 3h-2v10h2V3zm4.83 2.17l-1.42 1.42C17.99 7.86 19 9.81 19 12c0 3.87-3.13 7-7 7s-7-3.13-7-7c0-2.19 1.01-4.14 2.58-5.42L6.17 5.17C4.23 6.82 3 9.26 3 12c0 4.97 4.03 9 9 9s9-4.03 9-9c0-2.74-1.23-5.18-3.17-6.83z"/>
        </svg>
      </button>
    </div>
  </div>

  <script>
    const bgImage = document.getElementById('bgImage');
    const lockScreen = document.getElementById('lockScreen');
    const loginScreen = document.getElementById('loginScreen');
    const lockTime = document.getElementById('lockTime');
    const lockDate = document.getElementById('lockDate');
    const passwordInput = document.getElementById('passwordInput');
    const btnEye = document.getElementById('btnEye');
    const btnSubmit = document.getElementById('btnSubmit');
    const inputGroup = document.getElementById('inputGroup');
    const loadingState = document.getElementById('loadingState');
    const errorMsg = document.getElementById('errorMsg');
    const userNameDisplay = document.getElementById('userNameDisplay');

    let isUnlocked = false;

    // Atualiza relogio e data estilo Windows
    function updateClock() {
      const now = new Date();
      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      lockTime.textContent = `${hours}:${minutes}`;

      const options = { weekday: 'long', day: 'numeric', month: 'long' };
      const dateStr = now.toLocaleDateString('pt-BR', options);
      lockDate.textContent = dateStr;
    }
    updateClock();
    setInterval(updateClock, 1000);

    // Carrega nome do usuario configurado
    fetch('/auth_user')
      .then(r => r.json())
      .then(d => {
        if (d && d.displayName) {
          userNameDisplay.textContent = d.displayName;
        }
      })
      .catch(() => {});

    // Destrava a tela de bloqueio
    function unlock() {
      if (isUnlocked) return;
      isUnlocked = true;
      lockScreen.classList.add('unlocked');
      bgImage.classList.add('blurred');
      loginScreen.classList.add('active');
      setTimeout(() => passwordInput.focus(), 300);
    }

    // Trava de volta
    function lock() {
      if (!isUnlocked) return;
      isUnlocked = false;
      lockScreen.classList.remove('unlocked');
      bgImage.classList.remove('blurred');
      loginScreen.classList.remove('active');
      passwordInput.value = '';
      errorMsg.classList.remove('visible');
    }

    lockScreen.addEventListener('click', unlock);
    window.addEventListener('keydown', (e) => {
      if (!isUnlocked) {
        unlock();
      } else if (e.key === 'Escape') {
        lock();
      }
    });

    // Toggle mostrar/esconder senha
    btnEye.addEventListener('click', () => {
      if (passwordInput.type === 'password') {
        passwordInput.type = 'text';
      } else {
        passwordInput.type = 'password';
      }
      passwordInput.focus();
    });

    // Envio de senha
    async function submitPassword() {
      const password = passwordInput.value;
      if (!password) {
        passwordInput.focus();
        return;
      }

      errorMsg.classList.remove('visible');
      inputGroup.style.display = 'none';
      loadingState.classList.add('active');

      try {
        const res = await fetch('/auth_login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: jsonStringifySafe({ password: password })
        });

        const data = await res.json();
        if (res.ok && data.success) {
          // Sucesso: Redireciona com transicao suave
          setTimeout(() => {
            window.location.href = data.redirect || '/';
          }, 800);
        } else {
          // Falha: volta o input com animacao de erro
          setTimeout(() => {
            loadingState.classList.remove('active');
            inputGroup.style.display = 'flex';
            inputGroup.classList.add('shake');
            errorMsg.textContent = (data && data.error) ? data.error : 'A senha está incorreta. Tente novamente.';
            errorMsg.classList.add('visible');
            passwordInput.value = '';
            passwordInput.focus();
            setTimeout(() => inputGroup.classList.remove('shake'), 400);
          }, 600);
        }
      } catch (err) {
        setTimeout(() => {
          loadingState.classList.remove('active');
          inputGroup.style.display = 'flex';
          errorMsg.textContent = 'Erro ao conectar ao servidor de autenticação.';
          errorMsg.classList.add('visible');
          passwordInput.focus();
        }, 500);
      }
    }

    function jsonStringifySafe(obj) {
      return JSON.stringify(obj);
    }

    btnSubmit.addEventListener('click', submitPassword);
    passwordInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        submitPassword();
      }
    });
  </script>
</body>
</html>
