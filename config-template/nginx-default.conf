# Rate limiting zone for auth endpoints to prevent brute-force attacks
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/s;

server {
  listen 3000 default_server;
  listen [::]:3000 default_server;
  absolute_redirect off;
  port_in_redirect off;

  # Security Headers
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-XSS-Protection "1; mode=block" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  # Subrequest Authentication
  auth_request /auth_verify;
  error_page 401 = @login_redirect;

  location = /auth_verify {
    internal;
    proxy_pass http://127.0.0.1:9099/auth_verify;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header X-Original-URI $request_uri;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Cookie $http_cookie;
  }

  location @login_redirect {
    return 302 /login;
  }

  location = /login {
    auth_request off;
    alias /config/login_assets/login.html;
    default_type text/html;
  }

  location = /lock_manager.js {
    auth_request off;
    alias /config/lock_manager.js;
    default_type application/javascript;
  }

  location /login_assets/ {
    auth_request off;
    alias /config/login_assets/;
  }

  location /auth_login {
    limit_req zone=auth_limit burst=10 nodelay;
    auth_request off;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://127.0.0.1:9099/auth_login;
  }

  location /auth_user {
    auth_request off;
    proxy_pass http://127.0.0.1:9099/auth_user;
  }

  location /auth_logout {
    auth_request off;
    proxy_pass http://127.0.0.1:9099/auth_logout;
  }

  location /auth_lock {
    auth_request off;
    proxy_pass http://127.0.0.1:9099/auth_lock;
  }

  location /auth_lock_status {
    auth_request off;
    proxy_pass http://127.0.0.1:9099/auth_lock_status;
  }

  location /auth_update_profile {
    # Requires active authenticated session
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Cookie $http_cookie;
    proxy_pass http://127.0.0.1:9099/auth_update_profile;
  }

  location / {
    alias /usr/share/selkies/web/;
    index  index.html index.htm;
    try_files $uri $uri/ =404;
  }

  location /devmode {
    proxy_set_header        Upgrade $http_upgrade;
    proxy_set_header        Connection "upgrade";
    proxy_set_header        Host $host;
    proxy_set_header        X-Real-IP $remote_addr;
    proxy_set_header        X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header        X-Forwarded-Proto $scheme;
    proxy_http_version      1.1;
    proxy_read_timeout      3600s;
    proxy_send_timeout      3600s;
    proxy_connect_timeout   3600s;
    proxy_buffering         off;
    client_max_body_size    10M;
    proxy_pass              http://127.0.0.1:5173;
  }

  location /api {
    proxy_set_header        Upgrade $http_upgrade;
    proxy_set_header        Connection "upgrade";
    proxy_set_header        Host $host;
    proxy_set_header        X-Real-IP $remote_addr;
    proxy_set_header        X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header        X-Forwarded-Proto $scheme;
    proxy_http_version      1.1;
    proxy_read_timeout      3600s;
    proxy_send_timeout      3600s;
    proxy_connect_timeout   3600s;
    proxy_buffering         off;
    proxy_request_buffering off;
    client_max_body_size    0;
    proxy_pass              http://127.0.0.1:8082;
  }

  location /pelorus/ {
    proxy_set_header        Upgrade $http_upgrade;
    proxy_set_header        Connection "upgrade";
    proxy_set_header        Host $host;
    proxy_set_header        X-Real-IP $remote_addr;
    proxy_set_header        X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header        X-Forwarded-Proto $scheme;
    proxy_http_version      1.1;
    proxy_read_timeout      3600s;
    proxy_send_timeout      3600s;
    proxy_connect_timeout   3600s;
    proxy_buffering         off;
    client_max_body_size    10M;
    proxy_pass              http://127.0.0.1:5100/;
  }

  # Fallback for booting up container to prevent blank white screens
  error_page 500 502 503 504 = @loading_gateway;
  location @loading_gateway {
    default_type text/html;
    return 200 '<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><meta http-equiv="refresh" content="2"><title>Iniciando Desktop...</title><style>body{background:#0b0f19;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;margin:0;overflow:hidden}.loader{width:46px;height:46px;border:3px solid rgba(255,255,255,0.15);border-top-color:#0078d4;border-radius:50%;animation:spin .8s linear infinite;margin-bottom:20px}@keyframes spin{to{transform:rotate(360deg)}}h2{font-size:20px;font-weight:500;margin:0 0 8px 0}p{color:#8892b0;margin:0;font-size:14px}</style></head><body><div class="loader"></div><h2>Iniciando Cloud Desktop...</h2><p>Carregando serviços e área de trabalho. Conectando em instantes...</p></body></html>';
  }
}

