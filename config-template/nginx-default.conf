server {
  listen 3000 default_server;
  listen [::]:3000 default_server;
  absolute_redirect off;
  port_in_redirect off;

  # Subrequest Authentication
  auth_request /auth_verify;
  error_page 401 = @login_redirect;

  location = /auth_verify {
    internal;
    proxy_pass http://127.0.0.1:9099/auth_verify;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header X-Original-URI $request_uri;
    proxy_set_header Cookie $http_cookie;
  }

  location @login_redirect {
    return 302 /login;
  }

  location = /login {
    auth_request off;
    alias /config/login_assets/login.html;
    default_type text/html;
  }

  location = /lock_manager.js {
    auth_request off;
    alias /config/lock_manager.js;
    default_type application/javascript;
  }

  location /login_assets/ {
    auth_request off;
    alias /config/login_assets/;
  }

  location /auth_login {
    auth_request off;
    proxy_pass http://127.0.0.1:9099/auth_login;
  }

  location /auth_user {
    auth_request off;
    proxy_pass http://127.0.0.1:9099/auth_user;
  }

  location /auth_logout {
    auth_request off;
    proxy_pass http://127.0.0.1:9099/auth_logout;
  }

  location /auth_lock {
    auth_request off;
    proxy_pass http://127.0.0.1:9099/auth_lock;
  }

  location /auth_lock_status {
    auth_request off;
    proxy_pass http://127.0.0.1:9099/auth_lock_status;
  }

  location /auth_update_profile {
    auth_request off;
    proxy_pass http://127.0.0.1:9099/auth_update_profile;
  }

  location / {
    alias /usr/share/selkies/web/;
    index  index.html index.htm;
    try_files $uri $uri/ =404;
  }

  location /devmode {
    proxy_set_header        Upgrade $http_upgrade;
    proxy_set_header        Connection "upgrade";
    proxy_set_header        Host $host;
    proxy_set_header        X-Real-IP $remote_addr;
    proxy_set_header        X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header        X-Forwarded-Proto $scheme;
    proxy_http_version      1.1;
    proxy_read_timeout      3600s;
    proxy_send_timeout      3600s;
    proxy_connect_timeout   3600s;
    proxy_buffering         off;
    client_max_body_size    10M;
    proxy_pass              http://127.0.0.1:5173;
  }

  location /api {
    proxy_set_header        Upgrade $http_upgrade;
    proxy_set_header        Connection "upgrade";
    proxy_set_header        Host $host;
    proxy_set_header        X-Real-IP $remote_addr;
    proxy_set_header        X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header        X-Forwarded-Proto $scheme;
    proxy_http_version      1.1;
    proxy_read_timeout      3600s;
    proxy_send_timeout      3600s;
    proxy_connect_timeout   3600s;
    proxy_buffering         off;
    proxy_request_buffering off;
    client_max_body_size    0;
    proxy_pass              http://127.0.0.1:8082;
  }

  location /pelorus/ {
    proxy_set_header        Upgrade $http_upgrade;
    proxy_set_header        Connection "upgrade";
    proxy_set_header        Host $host;
    proxy_set_header        X-Real-IP $remote_addr;
    proxy_set_header        X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header        X-Forwarded-Proto $scheme;
    proxy_http_version      1.1;
    proxy_read_timeout      3600s;
    proxy_send_timeout      3600s;
    proxy_connect_timeout   3600s;
    proxy_buffering         off;
    client_max_body_size    10M;
    proxy_pass              http://127.0.0.1:5100/;
  }

  error_page 500 502 503 504 /50x.html;
  location = /50x.html {
    root /usr/share/selkies/web/;
  }
}

